name: Build Thrive Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify workflow and native bridge sources
        run: |
          test -f .github/workflows/build-android.yml
          test -f src/native-bridge.js
          test -f index.html
          test -f package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Add native permissions
        run: node scripts/patch-android-manifest.mjs
      - name: Sync Capacitor plugins and assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thrive-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
